[workspace]
resolver = "2"
members = [
    "crates/qembed-domain",
    "crates/qembed-store",
    "crates/qembed-llm",
    "crates/qembed-tools",
    "crates/qembed-runtime",
    "crates/qembed-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
# Add third-party dependencies here with explicit versions.
# Crates should consume them with `dependency.workspace = true`.

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
