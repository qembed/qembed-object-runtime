[workspace]
resolver = "2"
members = [
    "crates/qembed-domain",
    "crates/qembed-store",
    "crates/qembed-llm",
    "crates/qembed-tools",
    "crates/qembed-runtime",
    "crates/qembed-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"

[workspace.dependencies]
axum = "=0.8.4"
async-nats = { version = "=0.53.0", default-features = false, features = ["jetstream", "ring"] }
tower = { version = "=0.5.2", features = ["util"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
serde_jcs = "=0.2.0"
sha2 = "=0.10.8"
uuid = { version = "=1.16.0", features = ["serde", "v4"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid"] }
tokio = { version = "=1.44.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Keep SQLx's transitive URL/IDNA stack on the audited versions.
home = "=0.5.11"
idna_adapter = "=1.2.1"
icu_collections = "=2.1.1"
icu_locale_core = "=2.1.1"
icu_normalizer = "=2.1.1"
icu_normalizer_data = "=2.1.1"
icu_properties = "=2.1.1"
icu_properties_data = "=2.1.1"
icu_provider = "=2.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
