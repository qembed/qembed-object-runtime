name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, check, lint, dependency audit, and test (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Report duplicate dependencies
        run: cargo tree -d

      - name: Check crate dependency boundaries
        run: python3 scripts/check_architecture.py

      - name: Run security-sensitive compile-fail contracts
        run: cargo test -p qembed-domain --doc

      - name: Start PostgreSQL for SQLx metadata validation
        run: docker compose --project-name qembed-rust-test --file compose.test.yaml up --detach --wait

      - name: Check SQLx offline metadata
        env:
          DATABASE_URL: postgres://qembed_test:qembed_test@127.0.0.1:55432/qembed_test
        run: cargo sqlx prepare --check --workspace

      - name: Check workspace in SQLx offline mode
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets

      - name: Run workspace tests with PostgreSQL
        run: bash scripts/test-postgres.sh

  msrv:
    name: Minimum supported Rust version (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check workspace on MSRV
        run: cargo check --workspace

      - name: Run workspace tests on MSRV with PostgreSQL
        run: bash scripts/test-postgres.sh
