name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, dependency audit, check, and test (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Report duplicate dependencies
        run: cargo tree -d

      - name: Check crate dependency boundaries
        run: python3 scripts/check_architecture.py

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace

  msrv:
    name: Minimum supported Rust version (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check workspace on MSRV
        run: cargo check --workspace

      - name: Run workspace tests on MSRV
        run: cargo test --workspace
