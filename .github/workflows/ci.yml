name: Rust CI

on:
  # Validate the integration branch after merge. Feature branches are validated
  # once, by pull_request, rather than once on push and again on the PR event.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'crates/**'
              - 'tests/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'compose.test.yaml'
              - '.github/workflows/**'
            docs:
              - '*.md'
              - 'docs/**'

  docs:
    name: Documentation whitespace check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }}...HEAD

  rust:
    name: Format, check, lint, dependency audit, and test (Rust 1.100.0 / PostgreSQL 19 / pgvector 0.8.7)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        postgres: ["19"]
    env:
      POSTGRES_IMAGE: pgvector/pgvector:0.8.7-pg${{ matrix.postgres }}-bookworm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Capture resolved Cargo.lock for dependency pinning
        if: always()
        run: |
          printf '%s\n' '__LOCKFILE_BEGIN__'
          cat Cargo.lock
          printf '%s\n' '__LOCKFILE_END__'

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Report duplicate dependencies
        run: cargo tree -d

      - name: Check crate dependency boundaries
        run: python3 scripts/check_architecture.py

      - name: Run security-sensitive compile-fail contracts
        run: cargo test -p qembed-domain --doc

      - name: Start PostgreSQL for SQLx metadata validation
        run: docker compose --project-name qembed-rust-test --file compose.test.yaml up --detach --wait

      - name: Check SQLx offline metadata
        env:
          DATABASE_URL: postgres://qembed_test:qembed_test@127.0.0.1:55432/qembed_test
        run: cargo sqlx prepare --check --workspace

      - name: Check workspace in SQLx offline mode
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests with PostgreSQL
        run: bash scripts/test-postgres.sh

      - name: Upload M1a test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1a-test-evidence-postgres-${{ matrix.postgres }}
          path: target/test-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Upload resolved Cargo.lock for dependency review
        if: matrix.postgres == '19'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
