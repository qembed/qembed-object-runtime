name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, check, lint, dependency audit, and test (Rust 1.100.0 / PostgreSQL ${{ matrix.postgres }} / pgvector 0.8.7)
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "19"]
    env:
      POSTGRES_IMAGE: pgvector/pgvector:0.8.7-pg${{ matrix.postgres }}-bookworm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Report duplicate dependencies
        run: cargo tree -d

      - name: Check crate dependency boundaries
        run: python3 scripts/check_architecture.py

      - name: Run security-sensitive compile-fail contracts
        run: cargo test -p qembed-domain --doc

      - name: Start PostgreSQL for SQLx metadata validation
        run: docker compose --project-name qembed-rust-test --file compose.test.yaml up --detach --wait

      - name: Check SQLx offline metadata
        env:
          DATABASE_URL: postgres://qembed_test:qembed_test@127.0.0.1:55432/qembed_test
        run: cargo sqlx prepare --check --workspace

      - name: Check workspace in SQLx offline mode
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests with PostgreSQL
        run: bash scripts/test-postgres.sh

      - name: Upload M1a test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1a-test-evidence-postgres-${{ matrix.postgres }}
          path: target/test-evidence/
          if-no-files-found: error
          retention-days: 90
