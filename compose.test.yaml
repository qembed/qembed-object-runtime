services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg19-bookworm}
    environment:
      POSTGRES_DB: qembed_test
      POSTGRES_USER: qembed_test
      POSTGRES_PASSWORD: qembed_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qembed_test -d qembed_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  postgres-control-plane:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg19-bookworm}
    environment:
      POSTGRES_DB: qembed_control_plane_test
      POSTGRES_USER: qembed_test
      POSTGRES_PASSWORD: qembed_test
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qembed_test -d qembed_control_plane_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
